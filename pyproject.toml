[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "faultgate"
version = "0.4.1"
description = "FAULTLINE faultgate: open-source release gate for AI agents, trace checks, and regression decisions."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Samir Sawarkar" }]
keywords = ["ai", "agents", "evaluation", "reliability", "opentelemetry", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = ["pydantic>=2"]

[project.optional-dependencies]
laya = ["laya>=0.3.5"]
api = ["litellm>=1.70"]
pii = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2"]  # aes scout bad272c4: MIT, OK
dev = ["pytest>=8"]
demo = ["pyarrow", "huggingface_hub"]


[project.scripts]
faultgate = "faultgate.cli:main"

[project.urls]
Homepage = "https://www.faultline-labs.com/products/faultgate/"
Repository = "https://github.com/Faultline-lab/faultgate"
Issues = "https://github.com/Faultline-lab/faultgate/issues"
Evidence = "https://github.com/samirsawarkar/faultline-ai-reliability"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
